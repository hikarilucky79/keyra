app-id: io.github.hikarilucky79.keyra
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.zopfli

command: keyra-launcher

finish-args:
  - --socket=x11
  - --socket=wayland
  - --share=ipc
  - --socket=pulseaudio
  - --device=all
  - --talk-name=org.freedesktop.Notifications
  - --own-name=org.keyra.app

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/keyra/cargo
    FLUTTER_ENGINE_VERSION: 3.24.0

modules:
  - name: keyra-daemon
    buildsystem: simple
    build-commands:
      - cargo build --release
      - install -Dm0755 target/release/keyra-daemon -t /app/bin/
    sources:
      - type: git
        url: https://github.com/hikarilucky79/keyra.git
        tag: v0.1.0
        commit: d25940bedfbe6cc57f8b9ed4942f4ea418bd84cc

  - name: keyra-flutter
    buildsystem: simple
    build-commands:
      - flutter pub get
      - flutter build linux --release
      - install -Dm0755 build/linux/x64/release/bundle/keyra_app -t /app/bin/
      - cp -r build/linux/x64/release/bundle/data /app/bin/
      - cp -r build/linux/x64/release/bundle/lib /app/bin/
    sources:
      - type: git
        url: https://github.com/hikarilucky79/keyra.git
        tag: v0.1.0
        commit: d25940bedfbe6cc57f8b9ed4942f4ea418bd84cc

  - name: keyra-launcher
    buildsystem: simple
    build-commands:
      - install -Dm0755 keyra-launcher /app/bin/keyra-launcher
    sources:
      - type: file
        path: packaging/keyra-launcher.sh

  - name: integration
    buildsystem: simple
    build-commands:
      - install -Dm0644 packaging/io.github.hikarilucky79.keyra.desktop -t /app/share/applications/
      - install -Dm0644 packaging/io.github.hikarilucky79.keyra.metainfo.xml -t /app/share/metainfo/
      - install -Dm0644 app_logo.png /app/share/icons/hicolor/256x256/apps/io.github.hikarilucky79.keyra.png
      - install -Dm0644 app_logo.png /app/share/icons/hicolor/scalable/apps/io.github.hikarilucky79.keyra.png
    sources:
      - type: git
        url: https://github.com/hikarilucky79/keyra.git
        tag: v0.1.0
        commit: d25940bedfbe6cc57f8b9ed4942f4ea418bd84cc
