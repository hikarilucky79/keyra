[package]
name = "keyra-daemon"
version = "0.1.0"
edition = "2021"
description = "Keyra daemon - low-latency typing sound engine"
default-run = "keyra-daemon"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-uds = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
crossbeam = "0.8"
libc = "0.2"
cpal = "0.15"
hound = "3"
rodio = { version = "0.17", default-features = false, features = ["vorbis", "wav", "flac", "mp3"] }
ringbuf = "0.3"
evdev = "0.12"
nix = { version = "0.27", features = ["fs", "signal", "user"] }
dirs = "5"
signal-hook = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
dashmap = "5"
arc-swap = "1"
bytes = "1"
futures = "0.3"
tokio-util = { version = "0.7", features = ["codec"] }
zip = "0.6"
active-win-pos-rs = "0.8"
notify = "6"
rand = "0.8"
include_dir = "0.7"
reqwest = { version = "0.11", features = ["json", "stream"] }
symphonia = { version = "0.5", features = ["all"] }
rubato = "0.14"
regex = "1"
base64 = "0.21"
