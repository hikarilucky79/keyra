name: keyra_app
description: Keyra - Premium typing sound engine for Linux
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.0
  google_fonts: ^6.2.0
  uuid: ^4.3.0
  file_picker: ^8.0.3
  tray_manager: ^0.5.2
  window_manager: ^0.5.1
  screen_retriever: ^0.2.0
  palette_generator: ^0.3.3+5
  macos_ui: ^2.1.0
  flutter_animate: ^4.5.2
  desktop_drop: ^0.4.4
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
