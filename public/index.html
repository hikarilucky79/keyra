<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- SEO Meta Tags -->
  <title>Keyra - Premium Keyboard Audio Feedback & Visualizer</title>
  <meta name="description" content="Experimente o Keyra: um gerador de som de digitação com baixíssima latência (Rust) e visualizador de teclado mecânico virtual premium (Flutter) com design inspirado no macOS." />
  <meta name="keywords" content="keyra, teclado mecanico, mechvibes, som de teclado, rust, flutter, glassmorphism, visualizador de teclado, baixa latencia" />
  
  <!-- OpenGraph Social Tags -->
  <meta property="og:title" content="Keyra - Mechanical Keyboard Sound Generator & Visualizer" />
  <meta property="og:description" content="Personalize sua experiência de digitação com som mecânico premium em tempo real e visualizador interativo em alta definição." />
  <meta property="og:image" content="keyra_preview.png" />
  <meta property="og:type" content="website" />
  
  <!-- Favicons Configuration -->
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  <link rel="icon" href="favicon.png" type="image/png" sizes="512x512" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />

  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-dark: #090a0f;
      --bg-card: rgba(18, 19, 29, 0.6);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-purple: #7c4dff;
      --accent-purple-glow: rgba(124, 77, 255, 0.15);
      --accent-blue: #00e5ff;
      --font-sans: 'Outfit', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-sans);
      overflow-x: hidden;
      line-height: 1.6;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(124, 77, 255, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(0, 229, 255, 0.08) 0%, transparent 40%);
      background-attachment: fixed;
    }

    /* Container */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 100;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-color);
      background-color: rgba(9, 10, 15, 0.7);
      transition: all 0.3s ease;
    }

    .header-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 72px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 24px;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    .logo img {
      width: 36px;
      height: 36px;
      /* 🟢 AQUI: Deixa TOTALMENTE REDONDO */
      border-radius: 50%; 
      /* 🟢 AQUI: Cor de fundo igual do site -> FAZ O QUADRICULADO SUMIR */
      background-color: var(--bg-dark); 
      /* 🟢 AQUI: Espaçamento interno para ficar bonito */
      padding: 4px; 
      box-shadow: 0 4px 12px rgba(124, 77, 255, 0.3);
      object-fit: contain; /* Garante que o logo não fique espremido */
    }

    .logo span {
      background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links {
      display: flex;
      gap: 32px;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-muted);
      font-size: 15px;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--text-main);
    }

    .nav-btn {
      background: linear-gradient(135deg, var(--accent-purple) 0%, #651fff 100%);
      color: #fff !important;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(124, 77, 255, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .nav-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(124, 77, 255, 0.6);
    }

    /* 🟢 AQUI: Favicon da aba REDONDO também (funciona Chrome/Edge) */
    link[rel="icon"] {
      border-radius: 50% !important;
      overflow: hidden !important;
      background-color: var(--bg-dark);
      padding: 2px;
    }

    /* Hero Section */
    .hero {
      padding: 160px 0 100px 0;
      text-align: center;
      position: relative;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(124, 77, 255, 0.1);
      border: 1px solid rgba(124, 77, 255, 0.2);
      color: #a5b4fc;
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 24px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(124, 77, 255, 0.4); }
      70% { box-shadow: 0 0 0 8px rgba(124, 77, 255, 0); }
      100% { box-shadow: 0 0 0 0 rgba(124, 77, 255, 0); }
    }

    .hero-title {
      font-size: 64px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -2px;
      margin-bottom: 24px;
      background: linear-gradient(to right, #ffffff 30%, #c7d2fe 70%, #818cf8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-subtitle {
      font-size: 20px;
      color: var(--text-muted);
      max-width: 680px;
      margin: 0 auto 40px auto;
      font-weight: 400;
    }

    .hero-ctas {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 60px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-purple) 0%, #651fff 100%);
      color: #fff;
      box-shadow: 0 8px 24px rgba(124, 77, 255, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(124, 77, 255, 0.6);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      backdrop-filter: blur(10px);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* App Preview Container */
    .preview-container {
      position: relative;
      max-width: 950px;
      margin: 0 auto;
      border-radius: 16px;
      padding: 8px;
      background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%);
      border: 1px solid var(--border-color);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .preview-img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      display: block;
    }

    /* Features Section */
    .features {
      padding: 100px 0;
      position: relative;
    }

    .section-header {
      text-align: center;
      margin-bottom: 60px;
    }

    .section-title {
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 16px;
    }

    .section-subtitle {
      color: var(--text-muted);
      font-size: 17px;
      max-width: 500px;
      margin: 0 auto;
    }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 30px;
    }

    .feature-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 40px 32px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .feature-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--accent-purple), var(--accent-blue));
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .feature-card:hover {
      transform: translateY(-5px);
      border-color: rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .feature-card:hover::before {
      opacity: 1;
    }

    .feature-icon {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: rgba(124, 77, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 24px;
      color: #a5b4fc;
      border: 1px solid rgba(124, 77, 255, 0.2);
    }

    .feature-card h3 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .feature-card p {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.6;
    }

    /* Architecture / Code Showcase */
    .arch {
      padding: 80px 0;
      background: rgba(10, 11, 19, 0.5);
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
    }

    .arch-content {
      display: flex;
      align-items: center;
      gap: 60px;
      flex-wrap: wrap;
    }

    .arch-text {
      flex: 1;
      min-width: 320px;
    }

    .arch-text h2 {
      font-size: 38px;
      font-weight: 700;
      margin-bottom: 20px;
      letter-spacing: -1px;
    }

    .arch-text p {
      color: var(--text-muted);
      font-size: 16px;
      margin-bottom: 24px;
    }

    .arch-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
