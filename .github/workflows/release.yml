name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ═══════════════════════════════════════════════════════════
  #  🐧  Linux — .deb + .AppImage
  # ═══════════════════════════════════════════════════════════
  linux:
    name: 🐧 Linux x64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.cargo/registry
            ~/.cargo/git
          key: linux-${{ hashFiles('**/Cargo.lock', '**/pubspec.lock') }}
          restore-keys: |
            linux-

      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            gcc g++ cmake ninja-build clang \
            libgtk-3-dev libasound2-dev libx11-dev libudev-dev \
            dpkg-dev fuse libfuse2

      - name: Build keyra-daemon
        run: |
          cd keyra-daemon
          cargo build --release

      - name: Build keyra-flutter (Linux)
        run: |
          cd keyra-flutter
          flutter pub get
          flutter build linux --release

      - name: Build .deb package
        run: |
          export GITHUB_REF_NAME="${{ github.ref_name }}"
          chmod +x packaging/build_deb.sh
          bash packaging/build_deb.sh

      - name: Build AppImage
        run: |
          chmod +x packaging/build_appimage.sh
          bash packaging/build_appimage.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            packaging/Keyra-*.AppImage
            packaging/keyra_*.deb

  # ═══════════════════════════════════════════════════════════
  #  📦  Publish GitHub Release
  # ═══════════════════════════════════════════════════════════
  release:
    name: 📦 Publish Release
    needs: [linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout (for release notes)
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Collect release files
        run: |
          mkdir -p final
          find release-assets -type f \( -name "*.AppImage" -o -name "*.deb" \) -exec cp {} final/ \;
          echo "=== Release files ==="
          ls -lh final/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Keyra ${{ github.ref_name }}"
          body: |
            ## ⌨️ Keyra ${{ github.ref_name }}

            **Premium low-latency typing sound engine & real-time mechanical keyboard visualizer (Linux Native).**

            ---

            ### 📥 Downloads

            | Plataforma | Formato | Arquivo |
            |---|---|---|
            | 🐧 Linux (Ubuntu/Debian) | `.deb` | `keyra_*_amd64.deb` |
            | 🐧 Linux (Universal) | `.AppImage` | `Keyra-x86_64.AppImage` |

            ### 🐧 Instalação no Linux

            **Debian/Ubuntu (.deb):**
            ```bash
            sudo dpkg -i keyra_*_amd64.deb
            ```

            **AppImage (qualquer distro):**
            ```bash
            chmod +x Keyra-x86_64.AppImage
            ./Keyra-x86_64.AppImage
            ```

            ---

            > Desenvolvido com 🦀 Rust + 💙 Flutter
          draft: false
          prerelease: false
          files: final/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
