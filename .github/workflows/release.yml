name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ═══════════════════════════════════════════════════════════
  #  🐧  Linux — .deb + .AppImage
  # ═══════════════════════════════════════════════════════════
  linux:
    name: 🐧 Linux x64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.cargo/registry
            ~/.cargo/git
          key: linux-${{ hashFiles('**/Cargo.lock', '**/pubspec.lock') }}
          restore-keys: |
            linux-

      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            gcc g++ cmake ninja-build clang \
            libgtk-3-dev libasound2-dev libx11-dev libudev-dev \
            libayatana-appindicator3-dev libsecret-1-dev \
            dpkg-dev fuse libfuse2

      - name: Build keyra-daemon
        run: |
          cd keyra-daemon
          cargo build --release

      - name: Build keyra-flutter (Linux)
        run: |
          cd keyra-flutter
          flutter pub get
          flutter build linux --release

      - name: Build .deb package
        run: |
          export GITHUB_REF_NAME="${{ github.ref_name }}"
          chmod +x packaging/build_deb.sh
          bash packaging/build_deb.sh

      - name: Build AppImage
        run: |
          chmod +x packaging/build_appimage.sh
          bash packaging/build_appimage.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            packaging/Keyra-*.AppImage
            packaging/keyra_*.deb

  # ═══════════════════════════════════════════════════════════
  #  🪟  Windows — .zip containing .exe
  # ═══════════════════════════════════════════════════════════
  windows:
    name: 🪟 Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\Pub\Cache
            ~\.cargo\registry
            ~\.cargo\git
          key: windows-${{ hashFiles('**/Cargo.lock', '**/pubspec.lock') }}
          restore-keys: |
            windows-

      - name: Enable Windows desktop build
        run: |
          flutter config --enable-windows-desktop

      - name: Build keyra-daemon
        run: |
          cd keyra-daemon
          cargo build --release

      - name: Build keyra-flutter (Windows)
        run: |
          cd keyra-flutter
          flutter pub get
          flutter build windows --release

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path final-windows
          # Copy all Flutter application files
          Copy-Item -Path "keyra-flutter\build\windows\x64\runner\Release\*" -Destination "final-windows" -Recurse -Force
          # Copy Rust daemon exe
          Copy-Item -Path "target\release\keyra-daemon.exe" -Destination "final-windows\keyra-daemon.exe" -Force
          # Create zip file in packaging directory
          New-Item -ItemType Directory -Force -Path packaging
          Compress-Archive -Path final-windows\* -DestinationPath packaging\Keyra-Windows-x64.zip

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: packaging/Keyra-Windows-x64.zip

  # ═══════════════════════════════════════════════════════════
  #  📦  Publish GitHub Release
  # ═══════════════════════════════════════════════════════════
  release:
    name: 📦 Publish Release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout (for release notes)
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Collect release files
        run: |
          mkdir -p final
          find release-assets -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.zip" \) -exec cp {} final/ \;
          echo "=== Release files ==="
          ls -lh final/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Keyra ${{ github.ref_name }}"
          body: |
            ## ⌨️ Keyra ${{ github.ref_name }}

            **Premium low-latency typing sound engine & real-time mechanical keyboard visualizer.**

            ---

            ### 📥 Downloads

            | Plataforma | Formato | Arquivo |
            |---|---|---|
            | 🪟 Windows | `.zip` | `Keyra-Windows-x64.zip` |
            | 🐧 Linux (Ubuntu/Debian) | `.deb` | `keyra_*_amd64.deb` |
            | 🐧 Linux (Universal) | `.AppImage` | `Keyra-x86_64.AppImage` |

            ### 🪟 Instalação no Windows
            1. Baixe e extraia o arquivo `Keyra-Windows-x64.zip`.
            2. Execute o `keyra_app.exe` (a interface gráfica iniciará o daemon automaticamente em segundo plano).

            ### 🐧 Instalação no Linux

            **Debian/Ubuntu (.deb):**
            ```bash
            sudo dpkg -i keyra_*_amd64.deb
            ```

            **AppImage (qualquer distro):**
            ```bash
            chmod +x Keyra-x86_64.AppImage
            ./Keyra-x86_64.AppImage
            ```

            ---

            > Desenvolvido com 🦀 Rust + 💙 Flutter
          draft: false
          prerelease: false
          files: final/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
