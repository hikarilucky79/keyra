name: Keyra Multiplatform Build & Release

on:
  push:
    tags:
      - 'v*.*.*' # Dispara automaticamente ao criar uma tag de versão (ex: v0.1.0)

permissions:
  contents: write

jobs:
  # ================= LINUX BUILD =================
  build-linux:
    name: Build & Package Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libasound2-dev pkg-config libx11-dev libxi-dev libxtst-dev

      - name: Cache Cargo Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            keyra-daemon/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd keyra-flutter
          flutter pub get

      - name: Build Debian and AppImage Packages
        run: |
          chmod +x packaging/build_deb.sh packaging/build_appimage.sh
          # Executa os scripts de build automatizados que criamos
          ./packaging/build_deb.sh
          ./packaging/build_appimage.sh

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: linux-packages
          path: |
            packaging/keyra_*.deb
            packaging/Keyra-*.AppImage

  # ================= WINDOWS BUILD =================
  build-windows:
    name: Build & Package Windows
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Cache Cargo Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            keyra-daemon/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd keyra-flutter
          flutter pub get

      - name: Build Rust Daemon (Windows)
        run: |
          cd keyra-daemon
          cargo build --release --target x86_64-pc-windows-msvc

      - name: Build Flutter UI (Windows)
        run: |
          cd keyra-flutter
          flutter build windows --release

      - name: Assemble Windows Bundle
        shell: pwsh
        run: |
          # Cria pasta temporária de empacotamento
          New-Item -ItemType Directory -Force -Path "packaging/win_release"
          
          # Copia o bundle do Flutter Windows
          Copy-Item -Recurse -Path "keyra-flutter/build/windows/x64/release/runner/*" -Destination "packaging/win_release"
          
          # Copia o Daemon compilado para a mesma pasta da UI (assim ela localiza o daemon automaticamente)
          Copy-Item -Path "keyra-daemon/target/x86_64-pc-windows-msvc/release/keyra-daemon.exe" -Destination "packaging/win_release/keyra-daemon.exe"
          
          # Compacta tudo em um arquivo ZIP portátil
          Compress-Archive -Path "packaging/win_release/*" -DestinationPath "packaging/Keyra-Windows-Portable.zip"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: windows-package
          path: packaging/Keyra-Windows-Portable.zip

  # ================= CREATE RELEASE =================
  create-release:
    name: Create GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux Artifacts
        uses: actions/download-artifact@v3
        with:
          name: linux-packages
          path: dist/

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v3
        with:
          name: windows-package
          path: dist/

      - name: Create official GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/keyra_*.deb
            dist/Keyra-*.AppImage
            dist/Keyra-Windows-Portable.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
